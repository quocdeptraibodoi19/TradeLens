# ClickHouse (landing zone) migrations. Separate from alembic.ini (Postgres)
# because these are two independent databases/dialects/revision histories.
# Usage: alembic -c clickhouse_alembic.ini <command>

[alembic]
script_location = %(here)s/clickhouse_migration

prepend_sys_path = .

path_separator = os

# database URL.  This is consumed by the user-maintained env.py script only;
# env.py actually sets it from settings.clickhouse_url at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
